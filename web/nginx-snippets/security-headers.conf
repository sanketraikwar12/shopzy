# Response headers applied to every document and asset served by the web tier.
#
# Included per-location rather than declared once at the server level, because
# nginx replaces (not merges) inherited add_header directives as soon as a
# location declares one of its own.
add_header X-Content-Type-Options "nosniff"                          always;
add_header X-Frame-Options        "DENY"                             always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy     "geolocation=(self), camera=(), microphone=()" always;

# The SPA loads its own bundle and talks to the API on the same origin. Styles
# need 'unsafe-inline' for Tailwind's injected style element; scripts do not.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
