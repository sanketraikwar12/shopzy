# Maps an empty Upgrade header to "close" so ordinary requests keep their
# connection alive; a hardcoded "upgrade" broke reuse for every API call.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # --- Security headers --------------------------------------------------
    # nginx's add_header does NOT merge with the enclosing block: a location
    # that declares any header of its own silently drops every header set here.
    # The shared set therefore lives in a snippet each location includes.
    include /etc/nginx/snippets/security-headers.conf;

    # --- Compression -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    # --- Static assets: content-hashed, so cache them forever --------------
    location /assets/ {
        include    /etc/nginx/snippets/security-headers.conf;
        expires    1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files  $uri =404;
    }

    location ~* \.(?:svg|ico|png|jpg|jpeg|webp|avif|woff2)$ {
        include    /etc/nginx/snippets/security-headers.conf;
        expires    30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # --- API + uploads proxied to the Node service -------------------------
    # No add_header here: the API owns its own response headers (CSP, HSTS).
    location /api/ {
        proxy_pass         http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }

    location /static/ {
        include          /etc/nginx/snippets/security-headers.conf;
        proxy_pass       http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires          7d;
        add_header       Cache-Control "public" always;
    }

    # --- SPA fallback: every unknown path renders index.html ---------------
    location / {
        include    /etc/nginx/snippets/security-headers.conf;
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
